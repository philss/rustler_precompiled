name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }}, Elixir ${{ matrix.pair.elixir }}, OTP ${{ matrix.pair.otp }})
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            pair:
              elixir: "1.16"
              otp: "26"
          - os: ubuntu-24.04
            pair:
              elixir: "1.20"
              otp: "29"
            lint: true
          - os: ubuntu-24.04-arm
            pair:
              elixir: "1.20"
              otp: "29"
          - os: macos-15-intel
            pair:
              elixir: "1.20"
              otp: "29"
          - os: macos-15
            pair:
              elixir: "1.20"
              otp: "29"
          - os: windows-2025
            pair:
              elixir: "1.20"
              otp: "29"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.pair.otp}}
          elixir-version: ${{matrix.pair.elixir}}

      - uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ matrix.os }}-${{ runner.arch }}-mix-${{matrix.pair.elixir}}-${{matrix.pair.otp}}-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get

      - run: mix format --check-formatted
        if: ${{ matrix.lint }}

      - run: mix deps.unlock --check-unused
        if: ${{ matrix.lint }}

      - run: mix deps.compile

      - run: mix compile --warnings-as-errors
        if: ${{ matrix.lint }}

      - run: mix test
